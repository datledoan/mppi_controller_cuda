MPPIControllerCUDA:
    vx_max: 0.5
    vy_max: 0.0
    vx_min: -0.35
    wz_max: 1.9
    vx_std: 0.2
    vy_std: 0.2
    wz_std: 0.4
    optimizer_gamma: 0.015
    pure_noise_trajectories_percentage: 0.0

    noise_generator_use_colored_noise: true # false: gaussian noise, true: colored noise
    vx_noise_color_exponent: 0.0
    vy_noise_color_exponent: 0.0
    wz_noise_color_exponent: 0.0
    xy_goal_tolerance: 0.25
    yaw_goal_tolerance: 0.25
    theta_stopped_vel: 0.1
    trans_stopped_vel: 0.1
    controller_frequency: 20.0
    ackermann_constraints_min_turning_r: 0.2

    ax_max: 3.0
    ax_min: -3.0
    ay_max: 3.0
    az_max: 3.5

    constrain_cost_power: 1
    constrain_cost_weight: 4.0

    goal_angle_cost_power: 1
    goal_angle_cost_weight: 3.0

    goal_cost_power: 1
    goal_cost_weight: 15.0
    goal_threshold_to_consider: 1.4
    path_align_threshold_to_consider: 0.5
    path_angle_threshold_to_consider: 0.5
    prefer_forward_threshold_to_consider: 0.5

    obstacles_consider_footprint: false
    obstacles_cost_power: 1
    obstacles_repulsion_weight: 1.5
    obstacles_critical_weight: 20.0
    obstacles_collision_cost: 100000.0
    obstacles_collision_margin_distance: 0.3
    obstacles_near_goal_distance: 0.5

    cost_power: 1
    cost_weight: 0.0
    cost_critical_cost: 300.0
    cost_collision_cost: 1000000.0

    path_align_offset_from_furthest: 20
    path_align_max_path_occupancy_ratio: 0.07
    path_align_cost_power: 1
    path_align_cost_weight: 10.0

    path_angle_offset_from_furthest: 4
    path_angle_cost_power: 1
    path_angle_cost_weight: 2.2
    path_angle_max_angle_to_furthest: 0.785398

    path_follow_offset_from_furthest: 6
    path_follow_cost_power: 1
    path_follow_cost_weight: 5.0

    prefer_forward_cost_power: 1
    prefer_forward_cost_weight: 0.3

    twirling_cost_power: 1
    twirling_cost_weight: 0.0
    near_goal_twirling_cost_power: 1
    near_goal_twirling_cost_weight: 0.5

    velocity_deadband_cost_power: 1
    velocity_deadband_cost_weight: 35.0
    velocity_deadband_velocities_1: 0.0
    velocity_deadband_velocities_2: 0.0
    velocity_deadband_velocities_3: 0.0

    path_handler_max_robot_pose_search_dist: 1.5
    path_handler_prune_distance: 1.5
    path_handler_transform_tolerance: 0.1
    path_handler_enforce_path_inversion: false
    path_handler_inversion_xy_tolerance: 0.2
    path_handler_inversion_yaw_tolerance: 0.4

    noise_generator_regenerate_noises: true

    optimizer_model_dt: 0.05
    optimizer_time_steps: 56
    optimizer_iteration_count: 1

    optimizer_retry_attempt_limit: 1
    optimizer_temperature: 0.3
    optimizer_motion_model: "DiffDrive" # DiffDrive/Ackermann/Omni

    trajectory_visualizer_visualize_optimal: true
    trajectory_visualizer_visualize_samples: true
    trajectory_visualizer_time_step: 3
    trajectory_visualizer_samples_percentage: 0.05
