#!/usr/bin/env python

PACKAGE = "mppi_controller_cuda"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

grp_controller = gen.add_group("Controller", type="tab")
grp_controller.add("vx_max", double_t, 0, "Maximum forward velocity", 0.5, 0.0, 5.0)
grp_controller.add("vy_max", double_t, 0, "Maximum lateral velocity (Omni only)", 0.0, 0.0, 5.0)
grp_controller.add("vx_min", double_t, 0, "Minimum forward velocity", -0.35, -5.0, 5.0)
grp_controller.add("vx_std", double_t, 0, "Sampler noise std_dev for vx -- tune jointly with optimizer_temperature", 0.2, 0.0, 5.0)
grp_controller.add("vy_std", double_t, 0, "Sampler noise std_dev for vy (Omni only)", 0.2, 0.0, 5.0)
grp_controller.add("wz_std", double_t, 0, "Sampler noise std_dev for wz", 0.4, 0.0, 5.0)
grp_controller.add("optimizer_gamma", double_t, 0, "Weight of MPPI's control-cost/importance-sampling-correction term (matches mppi_controller_ros's optimizer_gamma)", 0.015, 0.0, 5.0)
grp_controller.add("pure_noise_trajectories_percentage", double_t, 0, "Fraction of rollouts sampled around a zero mean instead of the current warm-started mean, for exploring maneuvers unconstrained by the current (possibly stuck) mean -- CAUTION: interacts badly with optimizer_gamma>0 (see parameters_handler.hpp comment), keep near 0 unless optimizer_gamma is also 0", 0.0, 0.0, 1.0)
grp_controller.add("vx_noise_color_exponent", double_t, 0, "Colored-noise spectral exponent for vx sampling (0=white/independent per-step, 1=pink, 2=red/Brownian -- higher favors long coordinated excursions over independent per-step wiggles)", 0.0, 0.0, 2.0)
grp_controller.add("vy_noise_color_exponent", double_t, 0, "Colored-noise spectral exponent for vy sampling (0=white/independent per-step, 1=pink, 2=red/Brownian) -- only meaningful when optimizer_motion_model=Omni (is_holonomic); vy is forced to 0 by enforceConstraints for DiffDrive/Ackermann regardless of this exponent", 0.0, 0.0, 2.0)
grp_controller.add("wz_noise_color_exponent", double_t, 0, "Colored-noise spectral exponent for wz sampling (0=white/independent per-step, 1=pink, 2=red/Brownian -- higher favors long coordinated turning excursions, addressing MPPI's difficulty discovering sustained decisive turns under plain i.i.d. noise)", 1.0, 0.0, 2.0)
grp_controller.add("ax_max", double_t, 0, "Max forward acceleration (m/s^2), hard rate limit on sampled vx per rollout timestep -- matches mppi_controller_ros", 3.0, 0.0, 20.0)
grp_controller.add("ax_min", double_t, 0, "Max forward deceleration (m/s^2, negative), hard rate limit on sampled vx per rollout timestep -- matches mppi_controller_ros", -3.0, -20.0, 0.0)
grp_controller.add("ay_max", double_t, 0, "Max lateral acceleration (m/s^2, Omni only, currently unused pending vy rate-limiting support)", 3.0, 0.0, 20.0)
grp_controller.add("az_max", double_t, 0, "Max angular acceleration (rad/s^2), hard rate limit on sampled wz per rollout timestep -- matches mppi_controller_ros", 3.5, 0.0, 20.0)

# Constrain critic parameters
grp_constrain_critic = gen.add_group("ConstrainCritic", type="tab")
grp_constrain_critic.add("constrain_cost_power", int_t, 0, "Power of the cost for constraints", 1, 0, 10)
grp_constrain_critic.add("constrain_cost_weight", double_t, 0, "Weight of the cost for constraints", 4.0, 0.0, 100.0)

# Goal angle critic parameters
grp_goal_angle_critic = gen.add_group("GoalAngleCritic", type="tab")
grp_goal_angle_critic.add("goal_angle_cost_power", int_t, 0, "Power of the cost for the goal angle critic", 1, 0, 10)
grp_goal_angle_critic.add("goal_angle_cost_weight", double_t, 0, "Weight of the cost for the goal angle critic", 3.0, 0.0, 100.0)

# Goal critic parameters
grp_goal_critic = gen.add_group("GoalCritic", type="tab")
grp_goal_critic.add("goal_cost_power", int_t, 0, "Power of the cost for the goal critic", 1, 0, 10)
grp_goal_critic.add("goal_cost_weight", double_t, 0, "Weight of the cost for the goal critic", 5.0, 0.0, 100.0)
grp_goal_critic.add("goal_threshold_to_consider", double_t, 0, "Distance to goal at which the goal/goal_angle gate switches on (near_goal)", 1.4, 0.0, 10.0)
grp_goal_critic.add("path_align_threshold_to_consider", double_t, 0, "Distance to goal at which path_align switches off -- kept smaller than goal_threshold_to_consider so there's an overlap window instead of an abrupt transition", 0.5, 0.0, 10.0)
grp_goal_critic.add("path_angle_threshold_to_consider", double_t, 0, "Distance to goal at which path_angle switches off -- same overlap-window purpose as path_align_threshold_to_consider", 0.5, 0.0, 10.0)
grp_goal_critic.add("prefer_forward_threshold_to_consider", double_t, 0, "Distance to goal at which prefer_forward/twirling switch off -- same overlap-window purpose as path_align_threshold_to_consider", 0.5, 0.0, 10.0)

# Obstacles critic parameters
grp_obstacles_critic = gen.add_group("ObstaclesCritic", type="tab")
grp_obstacles_critic.add("obstacles_consider_footprint", bool_t, 0, "Whether to consider the footprint in the obstacles critic", False)
grp_obstacles_critic.add("obstacles_cost_power", int_t, 0, "Power of the cost for the obstacles critic", 1, 0, 10)
grp_obstacles_critic.add("obstacles_repulsion_weight", double_t, 0, "Weight of the repulsion cost for obstacles", 1.5, 0.0, 100.0)
grp_obstacles_critic.add("obstacles_critical_weight", double_t, 0, "Critical weight for obstacles", 20.0, 0.0, 100.0)
grp_obstacles_critic.add("obstacles_collision_cost", double_t, 0, "Collision cost for obstacles", 100000.0, 0.0, 10000000.0)
grp_obstacles_critic.add("obstacles_collision_margin_distance", double_t, 0, "Margin distance for collision in obstacles", 0.20, 0.0, 1.0)
grp_obstacles_critic.add("obstacles_near_goal_distance", double_t, 0, "Dedicated near-goal threshold for obstacles critic repulsion (matches mppi_controller_ros's own obstacles_near_goal_distance)", 0.5, 0.0, 10.0)

# Cost critic parameters
grp_cost_critic = gen.add_group("CostCritic", type="tab")
grp_cost_critic.add("cost_power", int_t, 0, "Power of the cost for the cost critic", 1, 0, 10)
grp_cost_critic.add("cost_weight", double_t, 0, "Weight of the raw-costmap-value repulsion cost -- kept at 0.0 (disabled), far below mppi_controller_ros's own value (3.81); see project memory for why", 0.0, 0.0, 100.0)
grp_cost_critic.add("cost_critical_cost", double_t, 0, "Critical cost for the cost critic (unreachable in point-robot mode, kept for parity)", 300.0, 0.0, 10000.0)
grp_cost_critic.add("cost_collision_cost", double_t, 0, "Collision cost for the cost critic", 1000000.0, 0.0, 100000000.0)

# Path align critic parameters
grp_path_align_critic = gen.add_group("PathAlignCritic", type="tab")
grp_path_align_critic.add("path_align_offset_from_furthest", int_t, 0, "Offset from the furthest point in the path", 20, 1, 100)
grp_path_align_critic.add("path_align_max_path_occupancy_ratio", double_t, 0, "Max fraction of the considered path blocked before path_align disengages entirely", 0.07, 0.0, 1.0)
grp_path_align_critic.add("path_align_cost_power", int_t, 0, "Power of the cost for the path align critic", 1, 0, 10)
grp_path_align_critic.add("path_align_cost_weight", double_t, 0, "Weight of the cost for the path align critic", 10.0, 0.0, 100.0)

# Path angle critic parameters
grp_path_angle_critic = gen.add_group("PathAngleCritic", type="tab")
grp_path_angle_critic.add("path_angle_offset_from_furthest", int_t, 0, "Offset from the furthest point in the path angle critic", 4, 1, 100)
grp_path_angle_critic.add("path_angle_cost_power", int_t, 0, "Power of the cost for the path angle critic", 1, 0, 10)
grp_path_angle_critic.add("path_angle_cost_weight", double_t, 0, "Weight of the cost for the path angle critic", 2.2, 0.0, 100.0)
grp_path_angle_critic.add("path_angle_max_angle_to_furthest", double_t, 0, "Maximum angle to the furthest point in the path angle critic", 0.785398, 0.0, 10.0)

# Path follow critic parameters
grp_path_follow_critic = gen.add_group("PathFollowCritic", type="tab")
grp_path_follow_critic.add("path_follow_offset_from_furthest", int_t, 0, "Offset from the furthest point in the path follow critic", 6, 1, 100)
grp_path_follow_critic.add("path_follow_cost_power", int_t, 0, "Power of the cost for the path follow critic", 1, 0, 10)
grp_path_follow_critic.add("path_follow_cost_weight", double_t, 0, "Weight of the cost for the path follow critic", 5.0, 0.0, 100.0)

# Prefer forward critic parameters
grp_prefer_forward_critic = gen.add_group("PreferForwardCritic", type="tab")
grp_prefer_forward_critic.add("prefer_forward_cost_power", int_t, 0, "Power of the cost for the prefer forward critic", 1, 0, 10)
grp_prefer_forward_critic.add("prefer_forward_cost_weight", double_t, 0, "Weight of the cost for the prefer forward critic", 0.3, 0.0, 100.0)

# Twirling critic parameters
grp_twirling_critic = gen.add_group("TwirlingCritic", type="tab")
grp_twirling_critic.add("twirling_cost_power", int_t, 0, "Power of the cost for the twirling critic", 1, 0, 10)
grp_twirling_critic.add("twirling_cost_weight", double_t, 0, "Weight of the cost for the twirling critic", 10.0, 0.0, 100.0)
grp_twirling_critic.add("near_goal_twirling_cost_power", int_t, 0, "Power of the near-goal-only |wz| penalty (separate from twirling_cost_weight, which is only active away from the goal)", 1, 0, 10)
grp_twirling_critic.add("near_goal_twirling_cost_weight", double_t, 0, "Weight of the near-goal-only |wz| penalty -- counteracts an unbounded wz drift/random-walk observed near the goal (worse with colored noise, but present with white noise too)", 0.5, 0.0, 100.0)

# Velocity deadband critic parameters
grp_velocity_deadband_critic = gen.add_group("VelocityDeadbandCritic", type="tab")
grp_velocity_deadband_critic.add("velocity_deadband_cost_power", int_t, 0, "Power of the cost for the velocity deadband critic", 1, 0, 10)
grp_velocity_deadband_critic.add("velocity_deadband_cost_weight", double_t, 0, "Weight of the cost for the velocity deadband critic", 35.0, 0.0, 100.0)
grp_velocity_deadband_critic.add("velocity_deadband_velocities_1", double_t, 0, "vx deadband", 0.0, -5.0, 5.0)
grp_velocity_deadband_critic.add("velocity_deadband_velocities_2", double_t, 0, "vy deadband (Omni only)", 0.0, -5.0, 5.0)
grp_velocity_deadband_critic.add("velocity_deadband_velocities_3", double_t, 0, "wz deadband", 0.0, -5.0, 5.0)

# Noise generator parameters
grp_noise_generator = gen.add_group("NoiseGenerator", type="tab")
grp_noise_generator.add("noise_generator_regenerate_noises", bool_t, 0, "Draw fresh noise every cycle instead of reusing one cached batch (matches mppi_controller_ros's NoiseGenerator toggle; CPU default is False)", False)

# Trajectory visualizer parameters
grp_trajectory_visualizer = gen.add_group("TrajectoryVisualizer", type="tab")
grp_trajectory_visualizer.add("trajectory_visualizer_visualize_optimal", bool_t, 0, "Publish the optimal trajectory (cheap: reuses the already-computed nominal rollout)", True)
grp_trajectory_visualizer.add("trajectory_visualizer_visualize_samples", bool_t, 0, "Publish sampled candidate trajectories (expensive: extra GPU kernel launch + transfer each cycle)", False)
grp_trajectory_visualizer.add("trajectory_visualizer_time_step", int_t, 0, "Timestep stride for candidate-trajectory markers", 3, 1, 100)

exit(gen.generate(PACKAGE, "mppi_controller_cuda", "MPPIControllerCUDA"))
