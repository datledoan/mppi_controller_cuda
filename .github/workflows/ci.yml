name: ROS CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [noetic]
    container:
      image: osrf/ros:${{ matrix.ros_distro }}-desktop-full

    steps:
    - uses: actions/checkout@v3

    - name: Install ROS build tools
      run: |
        apt-get update
        apt-get install -y python3-catkin-tools python3-rosdep python3-wstool wget
        rosdep update

    - name: Install CUDA toolkit
      run: |
        wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
        dpkg -i cuda-keyring_1.1-1_all.deb
        apt-get update
        apt-get install -y cuda-toolkit-12-4
        echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"
        echo "CUDA_HOME=/usr/local/cuda-12.4" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64" >> "$GITHUB_ENV"

    # Create workspace and clone the repository
    - name: Create workspace
      run: |
        mkdir -p /ros_ws/src
        cp -r $GITHUB_WORKSPACE /ros_ws/src/

    # Install project dependencies
    - name: Install project dependencies
      working-directory: /ros_ws
      run: |
        apt-get install -y ros-${{ matrix.ros_distro }}-dynamic-reconfigure ros-${{ matrix.ros_distro }}-base-local-planner ros-${{ matrix.ros_distro }}-mbf-costmap-nav

    # Build packages
    - name: Build
      working-directory: /ros_ws
      shell: bash
      run: |
        source /opt/ros/${{ matrix.ros_distro }}/setup.bash
        export PATH="/usr/local/cuda-12.4/bin:$PATH"
        catkin build
